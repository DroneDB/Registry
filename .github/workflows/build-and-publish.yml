name: Build and Publish Docker Image

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*
  pull_request:
    branches:
      - master
  workflow_dispatch:

# A new push to a PR supersedes the run in progress; master and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # The Hub is the commit this Registry pins, never Hub master: the image ships the
      # Hub its API matches
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: dronedb/registry
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            # Adds dronedb/registry:dev only on push to the develop branch
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # The Dockerfile installs the DroneDB build pinned in Directory.Build.props; a pinned
          # DroneDB CI build needs this token (scripts/ddb-release.sh). Build secrets never reach a layer.
          secrets: |
            dronedb_artifact_token=${{ secrets.DRONEDB_ARTIFACT_TOKEN }}
          tags: |
            ${{ steps.docker_meta.outputs.tags }}
            ${{ github.ref == 'refs/heads/master' && 'dronedb/registry:latest' || '' }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
