name: .NET Core

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # release.yml runs this same build + test before it publishes
  workflow_call:

# A new push to a PR supersedes the run in progress; master and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    # The Hub is the commit this Registry pins, never Hub master
    - uses: actions/checkout@v4
      with:
        path: registry
        submodules: recursive
    # Counts of patterns the backend refactor removes may only go down (build/quality-baseline.txt)
    - name: Quality metrics ratchet (no metric may grow)
      run: |
        cd registry
        bash scripts/quality-metrics.sh --check
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: registry/global.json
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Download and install latest DroneDB release
      run: |
        LATEST_RELEASE_URL=$(curl -s https://api.github.com/repos/DroneDB/DroneDB/releases/latest | grep "browser_download_url.*deb" | head -n 1 | cut -d '"' -f 4)
        echo "Downloading DroneDB from $LATEST_RELEASE_URL"
        curl -L -o dronedb.deb $LATEST_RELEASE_URL
        sudo apt-get update && sudo apt-get install -y ./dronedb.deb
    - name: Hub checks (tests + coverage, types, bundle budget, listener audit, ESLint)
      run: |
        cd registry/Registry.Web/ClientApp
        npm ci
        npm run test:coverage
        npm run typecheck
        npm run build:stats
        npm run check:bundle
        npm run check:listeners
        npm run lint
    - name: Build the project
      run: |
        cd registry
        dotnet build -c Release --verbosity minimal
    - name: Nullable allow-list (may only shrink)
      run: |
        cd registry
        bash scripts/check-nullable-allowlist.sh
    # Rebuilds with --no-incremental: an up-to-date build reports no warnings
    - name: Warning ratchet (no new compiler or analyzer warnings)
      run: |
        cd registry
        bash scripts/check-warnings.sh
    # Coverage comes from the Microsoft.CodeCoverage collector that Microsoft.NET.Test.Sdk ships:
    # one Cobertura file per test project, reported, not gated
    - name: Run tests (with code coverage)
      run: |
        cd registry
        whereis ddb
        ddb --version --debug
        dotnet test -c Release --verbosity minimal --collect "Code Coverage;Format=cobertura" --results-directory TestResults
    - name: Upload code coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: registry-coverage-cobertura
        path: registry/TestResults/**/*.cobertura.xml
        if-no-files-found: warn
